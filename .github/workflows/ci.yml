# NOTE:
# The gate every push to the default branch and every pull request must pass, run on the lowest Python
# `requires-python` allows and on the newest, because a project that vendors the checker runs it under its own
# interpreter, and a construct newer than the floor would fail there before any check ran.
#
# Every action is pinned to a full commit, with the release it names beside it, because a tag can be moved and a
# commit cannot; the runner's operating system release and uv are pinned for the same reason.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# NOTE:
# The job only reads the repository, so the token it receives can do nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Create the environment
        run: make setup

      - name: Run the gate
        run: make verify
